<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit vs Impostor - Game Master</title>
    <link rel="stylesheet" href="src/style.css?v=40">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&family=Macondo&family=Raleway:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- PWA Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b263b">
    <link rel="apple-touch-icon" href="src/screens/main-menu/assets/logo_dixit.png">
</head>

<body>

    <!-- NavegaciÃ³n Global (Fuera del contenedor para evitar clips en mÃ³vil) -->
    <nav id="global-nav" class="global-nav">
        <button id="btn-global-back" class="btn-nav btn-nav-back" title="AtrÃ¡s"></button>
        <button id="btn-global-home" class="btn-nav btn-nav-home" title="MenÃº Principal"></button>
    </nav>

    <div id="app-container">
        <!-- Las pantallas se cargarÃ¡n dinÃ¡micamente aquÃ­ -->

        <main id="main-content">
            <div id="static-content">
                <!-- PANTALLA MENÃš PRINCIPAL -->
                <section id="screen-main-menu" class="screen main-menu-screen active">
                    <!-- CAPAS DE FONDO DINAMICAS -->
                    <div class="menu-background-layer"></div>
                    <div class="menu-vortex"></div>
                    <div class="astronaut-orbit">
                        <div class="astronaut-clipper">
                            <img src="src/screens/main-menu/assets/santi_astronauta.png" class="santi-astronaut" alt="Santi">
                        </div>
                    </div>

                    <div class="main-banner-container">
                        <img src="src/screens/main-menu/assets/img_libro.png" alt="Libro" class="banner-side-img libro-img">
                        <div class="logo-pack-container main-logo-v2">
                            <img src="src/screens/main-menu/assets/dixit_logo.png" alt="Dixit" class="logo-dixit-part">
                            <img src="src/screens/main-menu/assets/vs_impostor_logo.png" alt="VS Impostor" class="logo-vs-part">
                        </div>
                        <img src="src/screens/main-menu/assets/img_bufon.png" alt="Bufon" class="banner-side-img bufon-img">
                    </div>

                    <div class="main-menu-actions">
                        <div class="btn-float-wrap">
                            <button id="btn-menu-new" class="btn-book">NUEVA PARTIDA</button>
                        </div>
                        <div class="btn-float-wrap">
                            <button id="btn-menu-scores" class="btn-organic btn-stone">MARCADORES</button>
                        </div>
                        <div class="btn-float-wrap">
                            <button id="btn-menu-characters" class="btn-organic btn-characters">JUGADORES</button>
                        </div>
                        <div class="btn-float-wrap">
                            <button id="btn-menu-rules" class="btn-organic btn-petal">REGLAS</button>
                        </div>
                    </div>

                </section>

                <!-- SECCIÓN PERSONAJES (NUEVA) -->
                <section id="screen-characters" class="screen">
                    <div class="menu-bg-container">
                        <img src="assets/IMG/personajes/fondo_personajes.png" class="menu-bg" alt="Fondo">
                    </div>
                    
                    <div class="characters-content-wrapper">
                        <header class="characters-header">
                            <button id="btn-characters-back" class="btn-back-mystic">
                                <span class="arrow">«</span> MENU
                            </button>
                        </header>

                        <div class="character-carousel-container">
                            <button id="btn-char-prev" class="btn-nav-char">«</button>
                            
                            <div class="card-vertical-stack">
                                <h1 id="character-name-display">NOMBRE JUGADOR</h1>
                                <div class="card-3d-wrapper" id="char-card-flip">
                                <div class="card-3d-inner">
                                    <div class="card-3d-front">
                                        <img id="main-char-img" src="" alt="Personaje" class="card-img">
                                        <div class="card-frame card-frame--inocente"></div>
                                        <div class="role-badge-overlay" id="current-role-label">INOCENTE</div>
                                    </div>
                                    <div class="card-3d-back">
                                        <div class="card-back-parchment">
                                            <h3>CARTA DE DESTINO</h3>
                                            <div class="separator-line"></div>
                                            <p id="char-description-text">Cargando crónica del personaje...</p>
                                            <p class="tap-hint-blink">- Pulsa para volver -</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button id="btn-char-next" class="btn-nav-char">»</button>
                    </div>

                        <div class="role-selector-tray">
                            <div class="role-thumb-container active" data-role="INOCENTE">
                                <div class="thumb-frame">
                                    <img src="" class="role-thumb-img-node" alt="Inocente">
                                </div>
                                <span class="role-name">INOCENTE</span>
                            </div>
                            <div class="role-thumb-container" data-role="IMPOSTOR">
                                <div class="thumb-frame">
                                    <img src="" class="role-thumb-img-node" alt="Impostor">
                                </div>
                                <span class="role-name">IMPOSTOR</span>
                            </div>
                            <div class="role-thumb-container" data-role="TURNO">
                                <div class="thumb-frame">
                                    <img src="" class="role-thumb-img-node" alt="Turno">
                                </div>
                                <span class="role-name">TURNO</span>
                            </div>
                            <div class="role-thumb-container" data-role="VICTORIA">
                                <div class="thumb-frame">
                                    <img src="" class="role-thumb-img-node" alt="Victoria">
                                </div>
                                <span class="role-name">VICTORIA</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- El botÃ³n de ajustes se mueve aquÃ­ para ser global -->
                <button id="btn-menu-settings" class="btn-settings" title="Ajustes"></button>

                <!-- PANTALLA SETUP -->
                <section id="screen-setup" class="screen">

                    <!-- ZONA 1: HEADER FIJO (siempre visible) -->
                    <div class="setup-header">
                        <h2 class="glow-text small">Nueva Partida</h2>
                    </div>

                    <div class="preset-section vortex-container">

                        <div id="preset-players-grid" class="preset-grid magic-vortex">
                            <!-- Chips generados por app.js -->
                        </div>
                    </div>

                    <!-- ZONA 2: PERGAMINO CENTRAL FIJO (con scroll solo en lista de jug. nuevos) -->
                    <div class="setup-scroll-body layout-compact">
                        <div class="setup-parchment compact-card">

                            <div class="player-input-divider">
                                <span>O INVOCA UNO NUEVO</span>
                            </div>

                            <div class="player-input-container">
                                <input type="text" id="player-name" placeholder="¿Quién se une al sueño?"
                                    autocomplete="off" class="dreamy-input">
                                <button id="add-player" class="btn-lacre" aria-label="Invocar Jugador"></button>
                            </div>

                            <!-- Espacio liberado visualmente (Timer fue a screen-timer) -->

                            <!-- Lista de jugadores con scroll SOLO aquÃ­ -->
                            <div class="player-list-wrapper">
                                <ul id="player-list">
                                    <!-- Jugadores generados por app.js -->
                                </ul>
                                <div class="scroll-fade-overlay"></div>
                            </div>

                        </div>
                    </div>

                    <!-- ZONA 3: FOOTER FIJO ORIGINAL (recuperamos su layout original) -->
                    <div class="setup-footer">
                        <button id="btn-start-game" class="btn-primary" disabled>Comenzar Partida</button>
                    </div>

                </section>

                <!-- PANTALLA MARCADORES GLOBALES (RANKING) -->
                <section id="screen-global-scores" class="screen">
                    <div class="global-header">
                        <img src="src/screens/global-scores/assets/btn_marcadores_globales.png" alt="Marcadores Globales" class="img-header-global">
                    </div>

                    <div class="global-scroll-body">
                        <div id="global-ranking-list" class="global-ranking-list">
                            <!-- Inyectado dinámicamente por app.js -->
                        </div>
                    </div>
                </section>
            </div>

            <!-- Contenedor para InyecciÃ³n DinÃ¡mica SPA -->
            <div id="dynamic-content"></div>
        </main>
    </div>

    <!-- Modal de ConfirmaciÃ³n Personalizado -->
    <div id="modal-container" class="hidden">
        <div class="modal glass-card">
            <p id="modal-message">Â¿EstÃ¡s seguro?</p>
            <div class="modal-actions">
                <button id="modal-btn-confirm" class="btn-primary">Confirmar</button>
                <button id="modal-btn-cancel" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Audio Global -->
    <audio id="bg-music" src="music/bg_music.mp3" loop preload="auto"></audio>

    <script type="module" src="src/app.js"></script>
    <script>
        // Registro de Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registrado!', reg))
                    .catch(err => console.error('Error al registrar SW', err));
            });
        }
    </script>

</body>

</html>
