<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="silverMetal-silverClockwork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"></stop>
      <stop offset="30%" stop-color="#babfc8"></stop>
      <stop offset="68%" stop-color="#838b95"></stop>
      <stop offset="100%" stop-color="#ecf2f8"></stop>
    </linearGradient>
    <radialGradient id="silverDark-silverClockwork" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#eef1f5"></stop>
      <stop offset="55%" stop-color="#9da5af"></stop>
      <stop offset="100%" stop-color="#5b646e"></stop>
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="126" fill="url(#silverMetal-silverClockwork)" stroke="#efefef" stroke-width="6"></circle>
  <circle cx="160" cy="160" r="104" fill="#bbb4ad" stroke="#6f6964" stroke-width="8"></circle>
  
  <!-- Gears / Clockwork -->
  <g opacity="0.9">
    <!-- Gear 1 -->
    <g opacity="0.85">
      <circle cx="116" cy="196" r="38" fill="#8d847d" stroke="#514c47" stroke-width="4"></circle>
      <circle cx="116" cy="196" r="14" fill="none" stroke="#514c47" stroke-width="4"></circle>
    </g>
    <!-- Gear 2 -->
    <g opacity="0.85">
      <circle cx="206" cy="199" r="32" fill="#847a73" stroke="#4b4642" stroke-width="4"></circle>
      <circle cx="206" cy="199" r="12" fill="none" stroke="#4b4642" stroke-width="4"></circle>
    </g>
    <!-- Gear 3 -->
    <g opacity="0.85">
      <circle cx="208" cy="109" r="23" fill="#8a7f77" stroke="#4c4742" stroke-width="4"></circle>
      <circle cx="208" cy="109" r="8" fill="none" stroke="#4c4742" stroke-width="4"></circle>
    </g>
  </g>

  <path d="M88 118 A74 74 0 0 1 232 118" fill="none" stroke="#615a55" stroke-width="3" opacity="0.65"></path>
  
  <circle cx="160" cy="160" r="78" fill="url(#silverDark-silverClockwork)" stroke="#f1f1f1" stroke-width="6"></circle>
  <circle cx="160" cy="160" r="63" fill="url(#silverMetal-silverClockwork)" stroke="#8a8f96" stroke-width="5"></circle>
</svg>
